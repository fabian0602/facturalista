<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada — FacturaLista RD</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-wrap { min-height: 100vh; display: grid; place-items: center; padding: 48px 0; text-align: center; }
    .error-wrap p { margin: 16px auto 0; max-width: 460px; color: var(--muted); }
    .error-wrap .error-code {
      margin: 0 auto;
      max-width: none;
      font-family: var(--font-display);
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.06em;
      color: var(--teal);
    }
    .error-wrap h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin-top: 8px; }
    .error-wrap p { margin: 16px auto 0; max-width: 460px; color: var(--muted); }
    .error-wrap .btn { margin-top: 28px; }
  </style>
</head>
<body>
  <main class="container error-wrap">
    <div>
      <p class="error-code">404</p>
      <h1>Esta página no existe.</h1>
      <p>El enlace puede estar roto o el contenido se movió. Vuelve al inicio o escríbeme por WhatsApp.</p>
      <a class="btn btn-primary btn-lg" href="./">Volver al inicio</a>
    </div>
  </main>
</body>
</html>
